<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cloud-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cloud-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad-cloud)" />

  <g filter="url(#cloud-shadow)">
    <ellipse cx="520" cy="170" rx="220" ry="100" fill="#1e293b" />
    <ellipse cx="430" cy="180" rx="170" ry="85" fill="#0f172a" />
    <ellipse cx="620" cy="140" rx="140" ry="70" fill="#0f172a" />
    <ellipse cx="470" cy="145" rx="120" ry="60" fill="url(#cloud-glow)" opacity="0.2" />
  </g>

  <rect x="160" y="240" width="280" height="180" rx="28" fill="#111827" stroke="#334155" stroke-width="4" filter="url(#cloud-shadow)" />
  <rect x="180" y="280" width="240" height="24" rx="12" fill="#0f172a" />
  <rect x="180" y="320" width="240" height="24" rx="12" fill="#0f172a" />
  <rect x="180" y="360" width="240" height="24" rx="12" fill="#0f172a" />

  <g fill="#38bdf8">
    <rect x="220" y="292" width="16" height="16" rx="4" />
    <rect x="220" y="332" width="16" height="16" rx="4" />
    <rect x="220" y="372" width="16" height="16" rx="4" />
  </g>

  <path d="M 360 200 C 420 120 520 120 580 200" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.55" />
  <path d="M 380 220 C 430 170 510 170 560 220" fill="none" stroke="#c7d2fe" stroke-width="16" stroke-linecap="round" />
  <path d="M 410 230 C 460 210 490 210 540 230" fill="none" stroke="#7dd3fc" stroke-width="14" stroke-linecap="round" />

  <text x="170" y="140" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="22" font-weight="700">Cloud Backup &amp; Server Sync</text>
  <text x="170" y="170" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Secure replication and remote recovery infrastructure</text>

  <path d="M 450 380 H 700" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
  <circle cx="720" cy="380" r="18" fill="#38bdf8" opacity="0.7" />
  <circle cx="730" cy="380" r="8" fill="#ffffff" />

  <path d="M 480 420 L 500 380 L 520 420" fill="#22d3ee" />
  <text x="470" y="460" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16" font-weight="600">Hybrid Cloud Infrastructure</text>
</svg>
