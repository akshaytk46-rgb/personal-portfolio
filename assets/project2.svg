<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-fw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shield-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="fw-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad-fw)" />
  <rect x="120" y="80" width="560" height="340" rx="32" fill="#111827" stroke="#293248" stroke-width="4" filter="url(#fw-shadow)" />

  <text x="160" y="130" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="22" font-weight="700">Security Perimeter</text>
  <rect x="160" y="150" width="520" height="8" rx="4" fill="#334155" opacity="0.8" />

  <g fill="url(#wall-grad)">
    <rect x="220" y="180" width="360" height="180" rx="20" />
    <rect x="240" y="210" width="320" height="20" rx="10" fill="#1f2937" />
    <rect x="240" y="250" width="320" height="20" rx="10" fill="#1f2937" />
    <rect x="240" y="290" width="320" height="20" rx="10" fill="#1f2937" />
    <rect x="240" y="330" width="320" height="20" rx="10" fill="#1f2937" />
  </g>

  <g fill="#94a3b8">
    <circle cx="280" cy="255" r="10" />
    <circle cx="320" cy="255" r="10" />
    <circle cx="360" cy="255" r="10" />
    <circle cx="400" cy="255" r="10" />
    <circle cx="440" cy="255" r="10" />
    <circle cx="480" cy="255" r="10" />
  </g>

  <path d="M 200 240 H 220" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 580 240 H 600" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 200 240 C 250 250 300 260 340 240" fill="none" stroke="#22d3ee" stroke-width="6" />
  <path d="M 580 240 C 540 260 500 270 460 240" fill="none" stroke="#38bdf8" stroke-width="6" />

  <path d="M 300 145 C 330 100 390 100 420 145 L 410 180 C 380 155 330 155 300 180 Z" fill="#0f172a" stroke="#64748b" stroke-width="3" />
  <path d="M 320 136 C 335 120 365 120 380 136 L 375 160 C 360 150 340 150 325 160 Z" fill="url(#shield-glow)" opacity="0.95" />
  <path d="M 360 132 L 360 155" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M 345 142 L 375 142" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <rect x="140" y="260" width="80" height="10" rx="5" fill="#334155" />
  <rect x="140" y="290" width="80" height="10" rx="5" fill="#334155" />
  <rect x="140" y="320" width="80" height="10" rx="5" fill="#334155" />

  <text x="160" y="430" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14" font-weight="600">FortiGate Style Network Edge</text>
</svg>
